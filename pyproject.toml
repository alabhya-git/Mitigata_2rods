[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "mitigata-engine"
version = "0.3.0"
description = "Evidence-first autonomous security assessment for authorized labs"
requires-python = ">=3.12,<3.14"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn>=0.30,<1", "pydantic>=2.9,<3",
  "PyYAML>=6,<7", "pyelftools>=0.31,<1", "pefile>=2024.8.26",
  "scapy>=2.6,<3",
  "playwright==1.63.0",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "httpx>=0.27,<1", "ruff>=0.9,<1", "trustme>=1.2,<2"]

[project.scripts]
mitigata = "mitigata.cli:main"

[tool.setuptools.packages.find]
include = ["mitigata*"]

[tool.setuptools.package-data]
mitigata = ["static/*", "data/*.yaml", "data/*.txt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py312"
line-length = 110
